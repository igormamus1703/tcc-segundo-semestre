# Parâmetros de cada estratégia de chunking.
# tokenizer: declare qual tokenizer é usado para contar "tokens" abaixo,
# e seja consistente em todo o pipeline (seção 3 do plano_tecnico.md).
tokenizer: tiktoken:cl100k_base

fixed:
  # Duas configurações, para comparar com o BR-TaxQA-R (2048/1024).
  - name: fixed_512_256
    size: 512
    stride: 256
  - name: fixed_1024_512
    size: 1024
    stride: 512

recursive:
  name: recursive_default
  chunk_size: 1024
  chunk_overlap: 128
  # Separadores genéricos de texto corrido, do mais para o menos
  # específico — de propósito SEM os cabeçalhos de seção ("EMENTA",
  # "RELATÓRIO", "VOTO", "ACÓRDÃO"): eles quase não ocorrem como texto no
  # corpus montado (ver seção 0-1 do plano_implementacao.md e o docstring
  # de src/segmenter/rules.py) e usá-los aqui equivaleria a dar ao chunker
  # "estrutura-cega" uma pista estrutural que ele não deveria ter.
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "

structural:
  # Duas variantes de run (seção F3 do plano_implementacao.md): "gold" usa
  # os spans das colunas do CSV do TCU (ablação sem erro de segmentação);
  # "pred" usa os spans previstos pelo Segmenter (o que um pipeline real
  # teria disponível sem estrutura ouro; acurácia medida em
  # results/tables/segmenter_validation.json).
  - name: structural_gold
    span_source: gold
    max_section_tokens: 1024
    overlap: 128
  - name: structural_pred
    span_source: pred
    max_section_tokens: 1024
    overlap: 128
