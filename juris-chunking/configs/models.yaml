# Embedders e retrievers.
# Nenhuma API paga (seção 3 do plano_tecnico.md) — só modelos abertos,
# auto-hospedáveis, executados localmente.
#
# Duas configurações NÃO são detalhe de performance, são de VALIDADE do
# experimento, e por isso ficam versionadas aqui junto do hf_id:
#
# 1. `max_seq_length` — a janela precisa acomodar o maior chunk do desenho
#    experimental (1024 tokens tiktoken ≈ 910 de subword). Com janela de 512,
#    ~37% do conteúdo dos chunks grandes é descartado no encode e só a
#    estratégia fixed_512_256 caberia inteira, ganhando vantagem artificial.
#    Medição em docs/docsleo/.../10-escolha-do-embedder.md.
# 2. `query_prefix` / `passage_prefix` — cada família foi treinada com um
#    formato de entrada. Prefixo errado degrada a recuperação silenciosamente.

embedders:
  # DEFAULT do pipeline. Escolhido por ser o único candidato sem gate que
  # acomoda os chunks de 1024 tokens sem truncar (janela nativa de 8192).
  # XLM-R nativo no transformers — não exige `trust_remote_code`.
  - name: bge_m3
    hf_id: "BAAI/bge-m3"
    query_prefix: ""
    passage_prefix: ""
    max_seq_length: 1024
    batch_size: 32
    dtype: auto        # fp16 na GPU, fp32 na CPU
    gated: false
    # Medido na RTX 5060: 47-102 chunks/s conforme o comprimento;
    # 10,1 h para as 2.200.767 chunks das cinco estratégias, 0% de truncamento.

  # Modelo compacto adaptado ao português, 13º de 93 no MTEB-BR
  # (arXiv:2607.04581) com 308M parâmetros e janela de 2048.
  # ATENÇÃO: GATED no Hugging Face — exige conta, aceite da licença Gemma em
  # https://huggingface.co/google/embeddinggemma-300m e `hf auth login`.
  # É o único passo manual do projeto; por isso não é o default.
  - name: pt_compact
    hf_id: "google/embeddinggemma-300m"
    query_prefix: "task: search result | query: "
    passage_prefix: "title: none | text: "
    max_seq_length: 1024
    batch_size: 32
    dtype: auto
    gated: true

  # Baseline multilíngue de referência. MIT, sem gate — mas a janela é de
  # apenas 512 tokens, então NÃO serve para a comparação principal: truncaria
  # 83% dos chunks e perderia 36% do conteúdo. Mantido para uma análise de
  # sensibilidade "o que acontece quando a janela do encoder é pequena", que é
  # uma limitação real de muitos pipelines RAG.
  - name: multilingual_ref
    hf_id: "intfloat/multilingual-e5-base"
    query_prefix: "query: "
    passage_prefix: "passage: "
    max_seq_length: 512
    batch_size: 32
    dtype: auto
    gated: false

  # Opcional: RoBERTaLexPT — só com fine-tune (é encoder MLM, não bi-encoder
  # de recuperação; ver aviso na seção 3 do plano_tecnico.md). O mesmo vale
  # para o BERTimbau, que vai bem no ranking GERAL do MTEB-BR mas não foi
  # treinado para retrieval.
  # - name: robertalexpt
  #   hf_id: "PREENCHER"

lexical:
  backend: bm25s   # alternativa: rank_bm25
  # Normalização aplicada igualmente na indexação e na busca
  # (src/indexing/text_norm.py): lowercase, remoção de acentos e stopwords PT.
  # Sem acentos porque 20 anos de publicação do TCU trazem o mesmo termo
  # acentuado e não acentuado ("acórdão"/"acordao").

dense:
  index: faiss.IndexFlatIP   # brute force, exato — sem erro de recall de ANN
  default_embedder: bge_m3

aggregation:
  default: max_pooling
  sensitivity_analysis: sum_top_k
  sum_top_k_value: 3

retrieval:
  # Busca fundo em chunks antes de agregar: documentos longos espalham seus
  # chunks pelo ranking, e truncar cedo perderia documentos relevantes.
  top_chunks: 2000
  top_docs: 1000
